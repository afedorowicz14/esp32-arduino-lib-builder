name: Build ESP32 Bluetooth Mesh Libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: bash ./tools/prepare-ci.sh

      - name: Compile ESP32 libraries
        shell: bash
        run: |
          set -e

          unset GITHUB_REPOSITORY_OWNER
          export IDF_BRANCH="release/v5.5"
          export IDF_TAG="v5.5.5"

          bash ./tools/update-components.sh

          git clone --depth 1 --branch 3.3.12 \
            https://github.com/espressif/arduino-esp32.git \
            components/arduino

          source ./tools/install-esp-idf.sh

          bash ./build.sh -s -e -t esp32

          # Check that the required Mesh options were enabled
          grep -q '^CONFIG_BLE_MESH_NODE=y$' sdkconfig
          grep -q '^CONFIG_BLE_MESH_PB_GATT=y$' sdkconfig
          grep -q '^CONFIG_BLE_MESH_SETTINGS=y$' sdkconfig
          grep -q '^CONFIG_BLE_MESH_GENERIC_SERVER=y$' sdkconfig
          grep -q '^CONFIG_BLE_MESH_GENERIC_ONOFF_CLI=y$' sdkconfig

      - name: Upload custom libraries
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Mesh-Libraries
          path: dist/*.tar.gz
          if-no-files-found: error
